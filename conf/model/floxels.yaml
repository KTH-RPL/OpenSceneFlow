name: floxels

target:
  _target_: src.models.Floxels
  itr_num: 500
  lr: 0.05
  # early stopping as in the paper: stop when the loss did not get 0.01 lower in the last 250 iterations.
  # NOTE: with early_patience 20 many frames stop at iteration 20 and the result is the zero flow (the lowest loss so far).
  early_patience: 250
  min_delta: 0.01
  grid_factor: 6
  point_cloud_range: [-80, -80, -3, 80, 80, 3]
  voxel_size: 0.5
  cluster_weight: 0.6

iter_only: True
# 5 frames as in the paper: pch2, pch1, pc0, pc1, pc2 (see src/dataset.py). E.g. num_frames=3 future_frames=1 for t-1, t, t+1.
num_frames: 4
future_frames: 2
pad_frames: False # a frame before the start of the scene is left out, instead of repeating the first frame.
