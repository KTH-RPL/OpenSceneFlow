dataset_path: /home/kin/data/av2/h5py/demo/val
checkpoint: /home/kin/model_zoo/seflow_best.ckpt
res_name: # if None will directly be the `model_name.ckpt` in checkpoint path
val_index_only: False # [True, False]
timer_sync: False # True: sync cuda in the timer to get the real runtime table (slower)
num_workers: 4 # data loading processes of each GPU process
procs_per_gpu: 1 # processes per GPU, each on its own scenes, see conf/eval.yaml

# no need to change
num_frames: 2
future_frames: 1 # frames after pc0 the model takes, see conf/eval.yaml
defaults:
  - hydra: default
  - model: deflow
seed: 42069
slurm_id: 00000
output: ${model.name}-${slurm_id}